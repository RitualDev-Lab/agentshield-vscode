name: Publish to Marketplaces & Release SBOM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for Open VSX OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: 'cyclonedx-json'
          output-file: 'agentshield-vscode-cyclonedx.sbom.json'
          artifact-name: 'agentshield-vscode-cyclonedx.sbom.json'
          upload-artifact: true
          upload-release-assets: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: 'spdx-json'
          output-file: 'agentshield-vscode-spdx.sbom.json'
          artifact-name: 'agentshield-vscode-spdx.sbom.json'
          upload-artifact: true
          upload-release-assets: false

      - name: Attach VSIX & SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c062e08bd5328157348241fa0833b7d8b97943b7 # v2.0.8
        with:
          generate_release_notes: true
          files: |
            *.vsix
            agentshield-vscode-cyclonedx.sbom.json
            agentshield-vscode-spdx.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Open VSX Registry (Cursor, Windsurf, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "🚀 Publishing to Open VSX using PAT..."
            npx ovsx publish -p "$OVSX_PAT" --skip-duplicate
          else
            echo "🔐 Publishing to Open VSX using OIDC Trusted Publishing..."
            npx ovsx publish --trusted-publishing --skip-duplicate
          fi

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -p "${{ secrets.VSCE_PAT }}" --no-dependencies
